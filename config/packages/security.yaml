security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                username_parameter: email
                password_parameter: password
                default_target_path: app_dashboard_redirect

            logout:
                path: app_logout
                target: app_login

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        # Les routes d'administration restent protégées
        - { path: ^/admin, roles: ROLE_ADMIN }
        # Les routes client (ex: panier, commandes) restent protégées
        - { path: ^/client, roles: ROLE_USER }
        
        # Rendre publiques les routes du blog (lecture seule)
        - { path: ^/blog, roles: PUBLIC_ACCESS }
        - { path: ^/article, roles: PUBLIC_ACCESS }
        - { path: ^/api/tts, roles: PUBLIC_ACCESS }
        - { path: ^/api/summary/ai, roles: PUBLIC_ACCESS }
        - { path: ^/commentaire/sentiment, roles: PUBLIC_ACCESS }
        - { path: ^/article/[0-9]+/image, roles: PUBLIC_ACCESS }

        # Par défaut, tout le reste est accessible seulement aux utilisateurs connectés
        # - { path: ^/, roles: ROLE_USER }   # à décommenter si vous voulez bloquer le reste

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10