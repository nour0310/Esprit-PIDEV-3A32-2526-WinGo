parameters:
    images_directory: '%kernel.project_dir%/public/images'
    gemini_api_key: '%env(GEMINI_API_KEY)%'
    giphy_api_key: '%env(GIPHY_API_KEY)%'
    # Utilisé pour l’affichage (Twig) et éventuellement pour générer des URLs absolues.
    # - Valeur par défaut dans `.env`: APP_DOMAIN=127.0.0.1
    # - En partage (ngrok), override dans `.env.local`: APP_DOMAIN=xxxx.ngrok-free.dev
    app_domain: '%env(APP_DOMAIN)%'

    # Contexte de routage (utile pour générer des URLs en CLI / emails).
    router.request_context.host: '%env(APP_DOMAIN)%'
    router.request_context.scheme: '%env(APP_SCHEME)%'
services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $giphyApiKey: '%giphy_api_key%'

    Symfony\Component\Finder\Finder:
        class: Symfony\Component\Finder\Finder

    App\Command\GenerateRepositoriesCommand:
        arguments:
            $finder: '@Symfony\Component\Finder\Finder'

    App\Twig\AppExtension:
        tags: ['twig.extension']

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    RateLimit\RateLimitBundle\EventListener\RateLimitListener:
        arguments:
            $container: '@service_container'
            $requestStack: '@request_stack'
        tags:
            - { name: kernel.event_subscriber }

    # Public alias to make the private limiter service accessible to our listener
    limiter.comment_submit.public:
        alias: 'limiter.comment_submit'
        public: true

    