parameters:
    images_directory: '%kernel.project_dir%/public/images'
    # Modèle ONNX Hugging Face pour le résumé (ex. Xenova/distilbart-cnn-6-6 ou moussaKam/barthez si disponible en ONNX)
    app.summary_model: '%env(default:app_summary_model_default:SUMMARY_MODEL)%'
    app_summary_model_default: 'Xenova/distilbart-cnn-6-6'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $weatherApiKey: '%env(OPENWEATHER_API_KEY)%'

    Symfony\Component\Finder\Finder:
        class: Symfony\Component\Finder\Finder

    App\Command\GenerateRepositoriesCommand:
        arguments:
            $finder: '@Symfony\Component\Finder\Finder'

    App\Service\TransformersSummaryService:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $summaryModel: '%app.summary_model%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'